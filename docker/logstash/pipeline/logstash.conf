# Logstash pipeline: receive from Beats, forward to Elasticsearch.
# Inside the compose network, Elasticsearch is reachable by its service
# name "elasticsearch" on port 9200 (not localhost).

input {
  beats {
    port => 5044
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logstash-%{+YYYY.MM.dd}"
  }
}

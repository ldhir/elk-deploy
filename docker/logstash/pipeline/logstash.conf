# Logstash pipeline: receive from Beats, forward to Elasticsearch.
# Inside the compose network, Elasticsearch is reachable by its service
# name "elasticsearch" on port 9200 (not localhost). With security on, the
# ES output must authenticate — password comes from the ELASTIC_PASSWORD env.

input {
  beats {
    port => 5044
  }
}

output {
  elasticsearch {
    hosts    => ["http://elasticsearch:9200"]
    user     => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index    => "logstash-%{+YYYY.MM.dd}"
  }
}

# Filebeat: tail logs and ship them to Logstash.
# Two sources:
#   1. the VM's own system logs (filestream input)
#   2. the Jenkins container's logs (Docker autodiscover, scoped by image)
# Add a new container source by adding another autodiscover condition.

filebeat.inputs:
  - type: filestream
    id: vm-system-logs
    enabled: true
    paths:
      - /var/log/syslog
      - /var/log/auth.log

# Watch Docker and ship logs from containers whose image name contains
# "jenkins". Scoping by image avoids shipping ELK's own container logs
# (which would create noisy feedback loops).
filebeat.autodiscover:
  providers:
    - type: docker
      templates:
        - condition:
            contains:
              docker.container.image: jenkins
          config:
            - type: container
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log

# Tag each event with container name/image/id so you can filter in Kibana.
processors:
  - add_docker_metadata: ~

output.logstash:
  hosts: ["logstash:5044"]

logging.level: info

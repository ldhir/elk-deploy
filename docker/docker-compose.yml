# ELK stack as Docker containers — run this ON the VM (the Docker host).
#
#   docker compose up -d
#   docker compose ps          # check health
#   docker compose logs -f     # follow logs
#   docker compose down        # stop (add -v to also wipe ES data)
#
# Versions/ports/password come from .env (copy .env.example -> .env first).
#
# Security (authentication) is ENABLED. Services authenticate as the `elastic`
# superuser via ELASTIC_PASSWORD. NOTE: HTTP is still plain http (no TLS) and
# services share the superuser — the production-correct setup adds TLS certs
# and dedicated users (kibana_system, a logstash writer). See README.

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION}
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      - node.name=es01
      - discovery.type=single-node
      - xpack.security.enabled=true              # ← authentication ON
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}     # sets the 'elastic' superuser pw on first boot
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms${ES_HEAP} -Xmx${ES_HEAP}"
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "${ES_PORT}:9200"
    healthcheck:
      # now needs credentials, or ES returns 401
      test: ["CMD-SHELL", "curl -s -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [elk]

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELK_VERSION}
    container_name: logstash
    restart: unless-stopped
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}   # used by the pipeline's ES output
    ports:
      - "${BEATS_PORT}:5044"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks: [elk]

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELK_VERSION}
    container_name: kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      # Kibana MUST use the built-in kibana_system service account, NOT the
      # elastic superuser (8.x refuses the latter). Its password is set in ES
      # via the _security API — see README. Humans still log in as 'elastic'.
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
    ports:
      - "${KIBANA_PORT}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks: [elk]

  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELK_VERSION}
    container_name: filebeat
    restart: unless-stopped
    user: root
    command: ["--strict.perms=false"]
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/log:/var/log:ro                                      # VM's own logs
      - /var/lib/docker/containers:/var/lib/docker/containers:ro  # container stdout logs
      - /var/run/docker.sock:/var/run/docker.sock:ro              # to discover containers
      - jenkins_home:/jenkins_home:ro                             # Jenkins build console logs
    depends_on:
      - logstash
    networks: [elk]

  # A real app that produces real logs. Jenkins LTS — web UI on 8080 (opened
  # to your IP via Terraform). Filebeat autodiscovers it by image name and
  # ships its logs into the stack.
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
    networks: [elk]

volumes:
  esdata:
    driver: local
  jenkins_home:
    driver: local

networks:
  elk:
    driver: bridge

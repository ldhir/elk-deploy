# ELK stack as Docker containers — run this ON the VM (the Docker host).
#
#   docker compose up -d
#   docker compose ps          # check health
#   docker compose logs -f     # follow logs
#   docker compose down        # stop (add -v to also wipe ES data)
#
# Versions/ports come from .env (copy .env.example -> .env first).
# Security (xpack) is disabled here for a simple first boot — see README
# before exposing this to anything real.

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION}
    container_name: elasticsearch
    restart: unless-stopped          # survive VM reboots / docker restarts
    environment:
      - node.name=es01
      - discovery.type=single-node
      - xpack.security.enabled=false
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms${ES_HEAP} -Xmx${ES_HEAP}"
    ulimits:
      memlock: { soft: -1, hard: -1 }   # allow heap to lock into RAM
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "${ES_PORT}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [elk]

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELK_VERSION}
    container_name: logstash
    restart: unless-stopped
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    ports:
      - "${BEATS_PORT}:5044"     # Beats input (Filebeat ships here)
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks: [elk]

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELK_VERSION}
    container_name: kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "${KIBANA_PORT}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks: [elk]

  # Ships log files INTO the stack. Runs here on the VM, reading the VM's own
  # /var/log. To add a source, edit filebeat/filebeat.yml `paths:`. To ship
  # logs from another box (e.g. Jenkins), run Filebeat THERE instead, pointed
  # at this VM's logstash:5044.
  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELK_VERSION}
    container_name: filebeat
    restart: unless-stopped
    user: root
    command: ["--strict.perms=false"]   # tolerate bind-mounted config perms
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/log:/var/log:ro            # the VM's own logs (read-only)
    depends_on:
      - logstash
    networks: [elk]

volumes:
  esdata:
    driver: local

networks:
  elk:
    driver: bridge
